    <script>
        async function getBingDailyImage() {
            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const bingUrl = 'https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=3';
                const response = await fetch(proxyUrl + encodeURIComponent(bingUrl));
                const data = await response.json();
                
                // 设置头部背景
                const headerImage = `https://www.bing.com${data.images[0].url}`;
                document.getElementById('headerBackground').style.backgroundImage = `url('${headerImage}')`;
                
                // 设置项目图片
                const projectImage1 = `https://www.bing.com${data.images[1].url}`;
                const projectImage2 = `https://www.bing.com${data.images[2].url}`;
                document.getElementById('projectImage1').style.backgroundImage = `url('${projectImage1}')`;
                document.getElementById('projectImage2').style.backgroundImage = `url('${projectImage2}')`;
            } catch (error) {
                console.error('获取必应图片失败:', error);
                // 使用备用图片
                const fallbackImage = 'https://picsum.photos/1920/1080';
                document.getElementById('headerBackground').style.backgroundImage = `url('${fallbackImage}')`;
                document.getElementById('projectImage1').style.backgroundImage = `url('${fallbackImage}?random=1')`;
                document.getElementById('projectImage2').style.backgroundImage = `url('${fallbackImage}?random=2')`;
            }
        }

        // 页面加载时获取图片
        window.addEventListener('load', getBingDailyImage);
    </script>
